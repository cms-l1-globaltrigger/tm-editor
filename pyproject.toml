[project]
name = "tm-editor"
description = "CMS Level-1 Trigger Menu Editor"
authors = [
    {name = "Bernhard Arnold", email = "bernhard.arnold@cern.ch"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tm-python @ https://github.com/cms-l1-globaltrigger/tm-python/archive/refs/tags/0.13.0.zip",
    "Markdown==3.8",
    "packaging==25.0",
    "PySide6==6.9.0",
]
classifiers = [
    "Framework :: PySide6",
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/cms-l1-globaltrigger/tm-editor"
Documentation = "https://globaltrigger.web.cern.ch/upgrade/tme"

[project.scripts]
tm-editor = "tmEditor.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "tmEditor.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
